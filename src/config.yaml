site:
  name: 土撥鼠喵喵教天地
  site: 'https://liswu.me'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: null # 待設定 Google Search Console 驗證 ID

# Default SEO metadata
metadata:
  title:
    default: 土撥鼠喵喵教天地
    template: '%s — 土撥鼠喵喵教天地'
  description: "土撥鼠喵喵的技術天地！分享 DevOps、後端開發、雲端技術與程式設計的實戰經驗。由 Lisbeth Wu 撰寫的技術部落格，涵蓋 AWS、Docker、Python、TypeScript 等主題。"
  robots:
    index: true
    follow: true
  openGraph:
    site_name: 土撥鼠喵喵教天地
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    handle: '@lisbethw1130'
    site: '@lisbethw1130'
    cardType: summary_large_image

i18n:
  language: zh-TW
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: true

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
